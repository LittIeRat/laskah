# /etc/nginx/sites-available/laskah
#
# 要点：
# 1. TLS 在这里终止，laskah 只听 127.0.0.1:8787。
# 2. SSE 流式必须关缓冲，否则 stream:true 会被攒住。
# 3. 管理面只允许可信网段访问，网关端点对外开放。

upstream laskah_backend {
    server 127.0.0.1:8787;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name laskah.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name laskah.example.com;

    ssl_certificate     /etc/letsencrypt/live/laskah.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/laskah.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 大请求体（长上下文）放宽，默认 1m 不够。
    client_max_body_size 32m;

    # 管理面：只放可信网段。改成你自己的办公网/VPN 网段。
    location /admin/ {
        allow 203.0.113.0/24;
        allow 127.0.0.1;
        deny all;

        proxy_pass http://laskah_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 「手动刷新全部余额 / 查询总余额」按账号串行等待，最长 3 分钟；
        # nginx 默认 60s 会先掉线，导致界面报网关超时而后台其实还在查。
        proxy_connect_timeout 15s;
        proxy_send_timeout    240s;
        proxy_read_timeout    240s;
    }

    # 网关端点：流式响应必须关缓冲。
    # 不带 /v1 前缀的别名（/responses、/messages）也要走这里，否则流式会被缓冲。
    location ~ ^/(v1|chat|completions|embeddings|models|responses|messages)(/|$) {
        proxy_pass http://laskah_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding on;

        # 上游大模型响应慢，读超时要放宽。
        proxy_connect_timeout 15s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
    }

    location / {
        proxy_pass http://laskah_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
