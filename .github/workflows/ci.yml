name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./... -count=1
      - name: build linux/amd64
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: go build -trimpath -ldflags '-s -w' -o bin/laskah-linux-amd64 ./cmd/laskah
      - name: build linux/arm64
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: arm64
        run: go build -trimpath -ldflags '-s -w' -o bin/laskah-linux-arm64 ./cmd/laskah
      - name: shell syntax
        run: bash -n scripts/install-linux.sh scripts/build.sh scripts/deploy-from-github.sh
