<!DOCTYPE html>
<html lang="zh-CN" data-theme="auto">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<title>登录 · Laskah</title>
<link rel="icon" href="/logo.png" type="image/png" />
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<div class="login-shell">
  <form class="login-card" id="login-form" autocomplete="off">
    <img class="login-logo" src="/logo.png" alt="Laskah" />
    <div class="login-word">Laskah</div>
    <p>API 负载均衡网关 · 请登录</p>
    <div class="field">
      <label for="login-user">管理员账户</label>
      <input id="login-user" type="text" autocomplete="username" spellcheck="false" />
    </div>
    <div class="field">
      <label for="login-password">密码</label>
      <input id="login-password" type="password" autocomplete="current-password" />
    </div>
    <button class="btn btn-primary" id="login-submit" type="submit">登录</button>
    <div class="login-error" id="login-error"></div>
    <div class="login-theme" id="login-theme"></div>
  </form>
</div>
<div class="toast" id="toast"></div>
<script src="/app.js"></script>
<script src="/login.js"></script>
</body>
</html>
